 ws.onmessage=(e)=>{
  let d=JSON.parse(e.data);
  if(d.tick){let q=d.tick.quote.toString(); let last=q.slice(-1); if(/[0-9]/.test(last)){digits.push(last); if(digits.length>100)digits.shift(); render();}}
  if(d.profit_table){let t=0,w=0; d.profit_table.transactions.forEach(x=>{let p=x.sell_details?+x.sell_details.profit:0; t+=p; if(p>0)w++;}); let r=(w/d.profit_table.count*100).toFixed(1); document.getElementById('aR').innerHTML=`P/L: $${t.toFixed(2)}<br>Win: ${r}%`;}
 };
}
